{% extends "MeuSite/base.html" %}
{% block title %}Criar Grupo{% endblock %}
{% block content %}
<div class="card">
  <h2>Criar Grupo</h2>
  <form method="post" action="{% url 'criar_grupo' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="nome">Nome do grupo</label>
      <input id="nome" name="nome" type="text" required>
    </div>

    <div class="form-group">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" required></textarea>
    </div>

    <div class="form-group">
      <label for="categoria">Categoria (opcional)</label>
      <input id="categoria" name="categoria" type="text">
    </div>

    <button class="btn" type="submit">Criar Grupo</button>
  </form>
</div>
{% endblock %}
