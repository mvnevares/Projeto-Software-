{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}StudyGram{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="{% url 'home' %}" class="brand">
        <img src="{% static 'img/logo.png' %}" alt="StudyGram" class="logo">
      </a>
      <nav class="nav">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'listaResumo' %}">Resumos</a>
        <a href="{% url 'grupos' %}">Grupos</a>
        <a href="{% url 'batalha' %}">Batalhas</a>
        {% if user.is_authenticated %}
          <a href="{% url 'perfil' user.username %}">Perfil</a>
          <a href="{% url 'logout' %}">Sair</a>
        {% else %}
          <a href="{% url 'login' %}">Entrar</a>
          <a href="{% url 'signup' %}" class="btn small">Criar conta</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ 2025 |default:2025 }} — StudyGram</p>
    </div>
  </footer>
</body>
</html>
