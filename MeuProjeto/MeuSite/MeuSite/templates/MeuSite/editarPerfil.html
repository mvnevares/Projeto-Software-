{% extends "MeuSite/base.html" %}
{% block title %}Editar Perfil{% endblock %}
{% block content %}
<div class="card">
  <h2>Editar Perfil</h2>
  <form method="post" action="{% url 'editar_perfil' %}" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
      <label for="display_name">Nome</label>
      <input id="display_name" name="display_name" type="text" value="{{ profile.display_name }}">
    </div>

    <div class="form-group">
      <label for="bio">Biografia</label>
      <textarea id="bio" name="bio">{{ profile.bio }}</textarea>
    </div>

    <div class="form-group">
      <label for="avatar">Alterar foto (opcional)</label>
      <input id="avatar" name="avatar" type="file" accept="image/*">
    </div>

    <button class="btn" type="submit">Salvar</button>
  </form>
</div>
{% endblock %}
