{% extends "MeuSite/base.html" %}
{% block title %}Vídeos{% endblock %}
{% block content %}
<div class="card">
  <h2>Vídeos</h2>
  <div class="row" style="margin-top:16px">
    {% for video in videos %}
      <div class="tile col">
        <div style="position:relative;padding-top:56.25%;height:0;overflow:hidden;border-radius:8px">
          <iframe src="{{ video.embed_url }}" style="position:absolute;left:0;top:0;width:100%;height:100%;border:0" allowfullscreen></iframe>
        </div>
        <h3 style="margin-top:12px">{{ video.titulo }}</h3>
        <p class="subtitle">{{ video.descricao|truncatechars:80 }}</p>
      </div>
    {% empty %}
      <p class="subtitle">Nenhum vídeo compartilhado ainda.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
