{% extends "MeuSite/base.html" %}
{% load static %}

{% block content %}
    <h1>Buscar Resumos</h1>

    <form method="GET" action="{% url 'buscar-resumo' %}">
        <input 
            type="text" 
            name="q" 
            placeholder="Digite o título ou termo de busca..."
            value="{{ termo_busca }}"
        >
        <button type="submit">Buscar</button>
    </form>
    
    {% comment %} 
    {% if resultados %}
        <h2>Resultados da Busca</h2>
        {% elif termo_busca %}
        <p>Nenhum resumo encontrado para "{{ termo_busca }}".</p>
    {% endif %}
    {% endcomment %}

    <p><a href="{% url 'listaResumo' %}">Voltar para a Lista Completa</a></p>

{% endblock %}
